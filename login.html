<main class="w-full min-h-screen flex items-center justify-center">
<!-- Section 1: Welcome Back (Main login form) -->
<section class="relative w-full min-h-screen flex flex-col lg:flex-row overflow-hidden">

<div class="absolute inset-0 bg-black/20"></div>
<div class="absolute inset-0 flex flex-col justify-center px-6 sm:px-12 md:px-16 text-white z-10">

<p class="font-body-lg text-body-lg max-w-md drop-shadow-md">Continue your journey in curating timeless floral artistry.</p>
</div>
</div>
<div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-10 md:p-12 bg-surface-container-low min-h-screen">

<div class="text-center mb-6">
<a class="font-display-lg text-3xl sm:text-4xl text-primary dark:text-primary-fixed tracking-widest uppercase inline-block hover:opacity-80 transition-opacity" href="index.html">Floréa</a>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-2 text-center">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 text-center">Access your curated designs and bookings.</p>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-1" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 input-field py-2 font-body-md text-on-surface placeholder-outline-variant" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-1" for="password">Password</label>
<input class="w-full bg-transparent border-0 input-field py-2 font-body-md text-on-surface placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-4 gap-2 text-xs sm:text-sm">
<div class="flex items-center">
<input class="w-4 h-4 text-primary bg-transparent border-outline focus:ring-primary focus:ring-2 rounded-sm cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block font-body-md text-on-surface-variant cursor-pointer whitespace-nowrap" for="remember">Remember Me</label>
</div>
<a class="font-label-sm text-primary hover:opacity-80 transition-opacity whitespace-nowrap" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-tertiary text-on-tertiary font-label-sm text-label-sm uppercase py-4 hover:bg-secondary transition-colors duration-300 tracking-widest mt-8" type="submit">
                        Sign In
                    </button>
<div class="relative mt-6 mb-2">
    <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-outline-variant/50"></div>
    </div>
    <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-surface-container-low text-on-surface-variant">Or continue with</span>
    </div>
</div>
<div class="flex flex-col sm:flex-row gap-4 mt-6">
    <button type="button" class="w-full flex items-center justify-center gap-2 border border-outline py-3 px-4 rounded-sm hover:bg-surface-container transition-colors text-on-surface">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="font-label-sm uppercase tracking-widest text-xs">Google</span>
    </button>
    <button type="button" class="w-full flex items-center justify-center gap-2 border border-outline py-3 px-4 rounded-sm hover:bg-surface-container transition-colors text-on-surface">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.05 2.78.72 3.4 1.8-3.02 1.69-2.51 5.86.35 6.96-.64 1.58-1.55 3.02-2.4 4.25zM12.03 7.25C11.9 4.3 14.32 1.83 17 1.86c.15 2.95-2.5 5.56-4.97 5.39z"/>
        </svg>
        <span class="font-label-sm uppercase tracking-widest text-xs">Apple</span>
    </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="text-primary font-bold hover:underline" href="register.html">Create one</a></p>
