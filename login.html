<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .input-field {
            border-bottom: 1px solid theme('colors.outline');
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-bottom-color: theme('colors.primary');
            outline: none;
            box-shadow: 0 1px 0 0 theme('colors.primary');
        }

        @keyframes subtle-zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .hero-img {
            animation: subtle-zoom 20s infinite alternate linear;
        }

        .soft-shadow {
            box-shadow: 0px 20px 50px rgba(27, 48, 34, 0.05);
        }

<main class="w-full min-h-screen flex items-center justify-center">
<!-- Section 1: Welcome Back (Main login form) -->
<section class="relative w-full min-h-screen flex flex-col md:flex-row overflow-hidden">
<div class="relative w-full md:w-1/2 h-[350px] md:h-auto overflow-hidden flex items-center">
<div class="absolute inset-0 bg-cover bg-center w-full h-full hero-img" style="background-image: url('https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=2560&auto=format&fit=crop')"></div>
<div class="absolute inset-0 bg-black/20"></div>
<div class="absolute inset-0 flex flex-col justify-center px-margin-mobile md:px-margin-desktop text-white z-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-4 drop-shadow-md">Welcome Back<br/>to Aurelia</h1>
<p class="font-body-lg text-body-lg max-w-md drop-shadow-md">Continue your journey in curating timeless floral artistry.</p>
</div>
</div>
<div class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-low min-h-screen">
<div class="glass-panel p-8 md:p-12 w-full max-w-md soft-shadow my-auto">
<div class="text-center mb-6">
<a class="font-display-lg text-4xl text-primary dark:text-primary-fixed tracking-widest uppercase inline-block hover:opacity-80 transition-opacity" href="index.html">Floréa</a>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-2 text-center">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 text-center">Access your curated designs and bookings.</p>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-1" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 input-field py-2 font-body-md text-on-surface placeholder-outline-variant" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-1" for="password">Password</label>
<input class="w-full bg-transparent border-0 input-field py-2 font-body-md text-on-surface placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-3 gap-2 text-xs sm:text-sm">
<div class="flex items-center shrink-0">
<input class="w-4 h-4 text-primary bg-transparent border-outline focus:ring-primary focus:ring-2 rounded-sm cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block font-body-md text-on-surface-variant cursor-pointer whitespace-nowrap" for="remember">Remember Me</label>
</div>
<a class="font-label-sm text-primary hover:opacity-80 transition-opacity whitespace-nowrap shrink-0" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-tertiary text-on-tertiary font-label-sm text-label-sm uppercase py-4 hover:bg-secondary transition-colors duration-300 tracking-widest mt-8" type="submit">
                        Sign In
                    </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="text-primary font-bold hover:underline" href="register.html">Create one</a></p>
</div>
</div>
</div>
</section>
</main>
